minimum_pre_commit_version: '3.7.0'
default_install_hook_types:
  - pre-commit
repos:
  - repo: https://github.com/sirwart/ripsecrets
    rev: v0.1.11
    hooks:
      - id: ripsecrets
        name: Ripsecrets
        args:
          - --strict-ignore
        types: [text]
  - repo: https://github.com/crate-ci/typos
    rev: v1.37.0
    hooks:
      - id: typos
        name: Typos
        args:
          - --config
          - .typos.toml
          - --force-exclude
        types: [text]
  - repo: local
    hooks:
      # Home Manager writes store symlinks through the dotbot directory links;
      # the target hash differs per host and per rebuild, so they are never content.
      - id: no-nix-store-symlinks
        name: No symlinks into /nix/store
        language: system
        types: [symlink]
        entry: sh -c 'rc=0; for f; do t=$(readlink -- "$f"); case "$t" in /nix/store/*) echo "$f -> $t"; rc=1 ;; esac; done; exit $rc' --
